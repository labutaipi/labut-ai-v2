services:
  postgres:
    image: postgres:16-alpine
    container_name: labut-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: labut
      POSTGRES_PASSWORD: labut_password
      POSTGRES_DB: labut_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
